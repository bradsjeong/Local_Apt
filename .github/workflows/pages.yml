name: Collect data and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 21 * * *'
permissions:
  contents: read
concurrency:
  group: local-apt-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify collector
        run: python -m unittest discover -s tests -v
      - name: Verify exit calculations
        run: node tests/test_exit.cjs
      - name: Reuse published snapshot for interface changes
        id: snapshot
        if: github.event_name == 'push'
        run: python scripts/reuse_snapshot.py
      - name: Collect official transactions
        if: steps.snapshot.outputs.ready != 'true'
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
        run: python scripts/collect.py
      - name: Collect Applyhome prices
        env:
          APPLYHOME_SERVICE_KEY: ${{ secrets.APPLYHOME_SERVICE_KEY }}
        run: python scripts/collect_applyhome.py
      - name: Collect KOSIS statistics
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python scripts/collect_kosis.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Preserve data snapshot
        uses: actions/upload-artifact@v4
        with:
          name: official-data
          path: site/data
          retention-days: 30
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
